<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ink Fill</title>
<style>
  :root {
    --ui-font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --bg: #f4f2ec; --card: #faf9f5; --soft: #eeece5; --line: #deded5; --edge: #cecec3;
    --ui-text: #202322; --ui-muted: #70756e;
    --blue: #202322; --blue-deep: #202322; --green: #4f9a62; --green-deep: #2f7743;
    --gold: #748775; --gold-deep: #566d57; --red: #cf4934; --ui-focus: #d94730;
    --accent: #202322; --accent-deep: #202322;   /* follows the world colour */
    --ink: #202322; --hot: #e9492f; --hot-deep: #b93320; --fill: #86a98a;
    --hair: rgba(32,35,34,.15); --lift: 0 1px 2px rgba(32,35,34,.10), 0 5px 14px rgba(32,35,34,.08); --press: 0 1px 2px rgba(32,35,34,.12);
    --ui-ease: cubic-bezier(.2,.7,.2,1); --ui-pop: cubic-bezier(.3,1.5,.5,1); --ui-fast: 160ms; --ui-med: 240ms;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ui-text); font: 15px/1.5 var(--ui-font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus, canvas:focus, select:focus { outline: none; }
  body.keyboard-input button:focus-visible, body.keyboard-input #board:focus-visible, body.keyboard-input select:focus-visible, body.keyboard-input textarea:focus-visible { outline: 3px solid var(--ui-focus); outline-offset: 2px; }
  svg { display: block; }
  #board { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; outline: none; cursor: grab; }
  body.aiming #board { cursor: grabbing; }

  /* ─── Chrome: light cards with a hairline edge and a soft lift; only the primary action is solid vermilion ─── */
  .surface { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; box-shadow: var(--lift); }
  /* Every action is an icon button; its name lives in the accessible label and tooltip. */
  .btn { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 56px; height: 56px; padding: 0;
    border: 1px solid var(--hair); border-radius: 16px; background: #fff; color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums;
    box-shadow: var(--lift); transition: transform 70ms, box-shadow 70ms, background-color var(--ui-fast), filter var(--ui-fast); }
  .btn svg { flex: none; width: 26px; height: 26px; }
  .btn:enabled:hover { background: var(--soft); }
  .btn:enabled:active { transform: translateY(1px); box-shadow: var(--press); }
  .btn:disabled { opacity: .3; cursor: default; }
  .btn.go { width: 96px; height: 72px; border-radius: 20px; border-color: transparent; background: var(--hot); color: #fff; box-shadow: 0 3px 0 var(--hot-deep), var(--lift); }
  .btn.go:enabled:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--hot-deep); }
  .btn.go svg { width: 34px; height: 34px; }
  .btn.go:enabled:hover { background: var(--hot); filter: brightness(1.06); }
  .btn.small { width: 44px; height: 44px; border-radius: 13px; box-shadow: var(--lift); }
  .btn.small svg { width: 22px; height: 22px; }
  .btn.small:enabled:active { transform: translateY(1px); box-shadow: var(--press); }
  .num { flex: none; min-width: 36px; height: 36px; padding: 0 8px; display: grid; place-items: center; border-radius: 11px;
    background: var(--accent); color: #fff; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* HUD: controls on the left, the goal meter in the middle, status on the right. */
  #hud { position: fixed; inset: max(12px, env(safe-area-inset-top)) 14px auto; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: start; gap: 12px; z-index: 2; pointer-events: none; }
  #controls { justify-self: start; display: flex; gap: 10px; pointer-events: auto; }
  #controls .btn { width: 52px; height: 52px; background: var(--card); box-shadow: var(--lift); }
  #controls .btn:enabled:hover { background: #fff; }
  #controls .btn:enabled:active { transform: translateY(1px); box-shadow: var(--press); }
  /* While a finger aims, one cancel target takes the exact place of the two controls: drag onto it and let go, or tap it with another finger. */
  #controls { position: relative; }
  #controls #aim-cancel { position: absolute; inset: 0; display: none; width: auto; height: auto; border: 2px solid var(--hot); background: #fff; color: var(--hot); box-shadow: var(--lift); }
  #controls #aim-cancel svg { width: 32px; height: 32px; }
  body.aiming.touch-aim #controls #aim-cancel { display: inline-flex; }
  body.aiming.touch-aim #menu, body.aiming.touch-aim #restart { visibility: hidden; }
  #controls #aim-cancel.hot { background: var(--hot); color: #fff; transform: scale(1.08); }
  #coverage { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 14px; width: 460px; max-width: 100%; min-width: 0; height: 60px;
    padding: 0 16px; font-variant-numeric: tabular-nums; }
  #cov-now { min-width: 2.5em; transform-origin: left center; font-weight: 800; font-size: 28px; line-height: 1; color: var(--ink); }
  .cov-goal { position: absolute; left: calc(var(--goal, 0) * 1%); top: 0; transform: translateX(-100%); display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; white-space: nowrap; color: var(--ui-muted); }
  .cov-goal svg { width: 12px; height: 12px; color: var(--hot); }
  #cov-track { position: relative; height: 38px; min-width: 0; }
  #cov-bar { position: absolute; inset: 20px 0 4px; overflow: hidden; background: #e9e6dd; border: 1px solid var(--hair); border-radius: 10px; }   /* one rounded clip for track and fill */
  #cov-fill { position: absolute; inset: 0 auto 0 0; width: 0; max-width: 100%;
    background: var(--fill); transition: width 420ms var(--ui-ease), background-color var(--ui-med); }
  #cov-tick { position: absolute; top: 16px; height: 22px; width: 2px; margin-left: -1px; background: var(--hot); border-radius: 1px; }
  #coverage.reached #cov-fill { background: var(--green); }
  #coverage.reached .cov-goal, #coverage.reached .cov-goal svg { color: var(--green-deep); }
  #coverage.reached #cov-tick { background: var(--green-deep); }
  #coverage.bump #cov-now { animation: bump 460ms var(--ui-pop); }
  @keyframes bump { 30% { transform: scale(1.22); } }
  #status { justify-self: end; display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 14px 0 7px; white-space: nowrap; }
  #lives { display: flex; gap: 2px; }
  #lives svg { width: 28px; height: 28px; }
  #lives .lost { animation: lost 560ms var(--ui-ease); }
  @keyframes lost { 0% { opacity: .25; } 45% { opacity: 1; transform: scale(.8); } }
  #lives .gain { animation: gain 520ms var(--ui-pop); }
  @keyframes gain { from { transform: scale(.2); } }
  #turns { display: flex; align-items: center; gap: 6px; }
  #pace { display: flex; }
  #pace svg { width: 21px; height: 21px; }
  #shots { font-size: 17px; font-variant-numeric: tabular-nums; font-weight: 800; }
  #shots b { font-weight: 800; font-size: 23px; } #shots span { color: var(--ui-muted); }

  #toast { position: fixed; top: 86px; left: 50%; transform: translate(-50%, 0);
    max-width: calc(100% - 28px); width: max-content; padding: 10px 18px; font-size: 15px; font-weight: 800; text-align: center;
    color: #fff; background: var(--ink); border: 0; border-radius: 999px;
    box-shadow: 0 3px 0 rgba(32,35,34,.25); word-break: keep-all;
    pointer-events: none; z-index: 3; transition: opacity var(--ui-med) var(--ui-ease), transform var(--ui-med) var(--ui-ease); }
  #toast.hidden { opacity: 0; transform: translate(-50%, -10px) scale(.94); }
  #toast:not(.hidden).obscured, body.aiming #toast:not(.hidden) { opacity: .25; }

  /* ─── Panels ─── */
  #overlay { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(32,35,34,.5); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    animation: fade-in var(--ui-med) var(--ui-ease); }
  #overlay[hidden] { display: none; }
  @keyframes fade-in { from { opacity: 0; } }
  .panel { position: relative; width: min(380px, 100%); max-height: calc(100dvh - 38px); overflow: auto; padding: 26px 22px; text-align: center;
    background: var(--card); border: 1px solid var(--hair); border-radius: 22px;
    box-shadow: 0 24px 60px rgba(32,35,34,.30); animation: panel-in 320ms var(--ui-pop); }
  .panel.wide { width: min(820px, 100%); }
  @keyframes panel-in { from { opacity: 0; transform: translateY(18px); } }
  h1 { font-size: 24px; font-weight: 800; line-height: 1.25; margin: 0 0 14px; letter-spacing: -.03em; word-break: keep-all; text-wrap: balance; }
  .action-row { display: flex; align-items: center; justify-content: center; gap: 12px; padding-bottom: 4px; }
  /* Panel menus: the primary action spans the row, labelled secondary actions share the row beneath it. */
  .menu { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 10px; padding-bottom: 4px; }
  .menu .btn { width: auto; min-width: 0; height: 52px; padding: 0 5px; gap: 6px; border-radius: 15px; font-size: 15px; line-height: 1.2; white-space: nowrap; }
  .menu .btn svg { width: 19px; height: 19px; }
  .menu .btn span { overflow: hidden; text-overflow: ellipsis; }
  .menu .btn.go { grid-column: 1 / -1; width: auto; height: 64px; gap: 10px; border-radius: 18px; font-size: 22px; }
  .menu .btn.go svg { width: 28px; height: 28px; }
  @media (max-width: 420px) { .menu[style*="cols:3"] .btn:not(.go) svg { display: none; } }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -6px 0 6px; text-align: left; }
  .panel-head h1 { margin: 0; }

  /* result */
  .result-stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 0 0 10px; }
  .result-stars svg { width: 62px; height: 62px; }
  .result-stars svg:nth-child(1) { transform: rotate(-8deg); } .result-stars svg:nth-child(3) { transform: rotate(8deg); }
  .result-stars svg:nth-child(2) { width: 82px; height: 82px; margin-bottom: 8px; }
  .result-stars .on { animation: star-in 520ms var(--ui-pop) backwards; }
  .result-stars .on:nth-child(2) { animation-delay: 180ms; } .result-stars .on:nth-child(3) { animation-delay: 360ms; }
  @keyframes star-in { from { opacity: 0; transform: scale(.2) rotate(-40deg); } }
  .result-icon { display: grid; place-items: center; margin: 0 0 18px; }
  .result-icon svg { width: 84px; height: 84px; animation: lost 560ms var(--ui-ease); }
  .stats { display: flex; justify-content: center; margin: 0 0 20px; font-size: 18px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stats span { display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 999px; background: var(--soft); }
  .stats svg { width: 20px; height: 20px; color: var(--ink); }

  /* stage sheet */
  .panel.sheet { display: flex; flex-direction: column; padding: 0; overflow: hidden; text-align: left; }
  .sheet-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px 13px 22px; border-bottom: 1px solid var(--hair); }
  .sheet-head h1 { margin: 0 auto 0 0; }
  .star-total { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .star-total svg { width: 22px; height: 22px; }
  .sheet-body { flex: 1; min-height: 0; overflow: auto; padding: 18px 22px 2px; background: var(--soft); }
  .chapter-head { margin: 0 0 14px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  .stage-grid { display: grid; align-items: start; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 16px 12px; margin: 0 0 26px; }
  .stage-tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; padding: 6px 6px 8px;
    background: var(--card); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--lift); text-align: center;
    transition: transform 90ms, box-shadow 90ms; }
  .stage-tile:enabled:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(32,35,34,.16); }
  .stage-tile:enabled:active { transform: translateY(1px); box-shadow: var(--press); }
  .stage-tile[aria-current="true"] { border-color: var(--hot); box-shadow: 0 0 0 2px var(--hot), var(--lift); background: #fff; }
  .tile-thumb { position: relative; display: block; width: 100%; }
  .stage-tile svg.thumb { width: 100%; height: auto; border-radius: 8px; background: var(--bg); }
  .tile-num { position: absolute; top: -9px; left: -9px; z-index: 1; min-width: 28px; height: 28px; padding: 0 7px; display: grid; place-items: center;
    border-radius: 14px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stage-tile[aria-current="true"] .tile-num { background: var(--hot); }
  .tile-boss { position: absolute; top: -9px; right: -9px; z-index: 1; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 14px; background: var(--ink); color: #f2b024; }
  .tile-boss svg { width: 17px; height: 17px; }
  .stage-tile:disabled .tile-boss { background: #a3a79e; color: #e6e3da; }
  .tile-stars { display: flex; gap: 1px; margin-top: auto; }
  .tile-stars svg { width: 18px; height: 18px; }
  .tile-lock { position: absolute; inset: 0; display: grid; place-items: center; }
  .tile-lock svg { width: 30px; height: 30px; color: #8d9189; }
  .stage-tile:disabled { cursor: default; background: #e6e3da; border-color: transparent; box-shadow: none; }
  .stage-tile:disabled svg.thumb { opacity: .4; filter: grayscale(.8); }
  .stage-tile:disabled .tile-num { background: #a3a79e; }
  .stage-tile:disabled .tile-stars { display: none; }

  /* pause */
  .settings { margin-top: 18px; border-top: 1px solid var(--line); }
  .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 54px; font-size: 16px; font-weight: 800; text-align: left; }
  .setting + .setting { border-top: 1px solid var(--line); }
  .setting:last-child { margin-bottom: -12px; }
  label.setting { cursor: pointer; }
  .switch { position: relative; flex: none; width: 56px; height: 32px; padding: 0; border: 0; border-radius: 999px; background: var(--edge);
    transition: background-color var(--ui-fast); }
  .switch i { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fff; box-shadow: var(--press);
    transition: transform var(--ui-fast) var(--ui-ease); }
  .switch[aria-checked="true"] { background: var(--green); }
  .switch[aria-checked="true"] i { transform: translateX(24px); }
  .language-control { display: flex; align-items: center; gap: 8px; font-weight: 800; }
  .language-control svg { flex: none; width: 24px; height: 24px; }
  .language-control select { max-width: 180px; min-height: 44px; padding: 5px 34px 5px 12px; border: 1px solid var(--hair); border-radius: 12px; appearance: none; -webkit-appearance: none;
    background: #fff url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 12 8%27%3E%3Cpath d=%27M1.5 1.5 6 6l4.5-4.5%27 fill=%27none%27 stroke=%27%23202322%27 stroke-width=%272.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") right 12px center / 12px 8px no-repeat; color: var(--ink); font: inherit; font-size: 15px; font-weight: 700; }
  .setting .language-control { width: 100%; justify-content: space-between; }
  .setting .language-control svg { display: none; }

  /* tutorial */
  .panel.tutorial { width: min(430px, 100%); }
  .panel.tutorial.steps h1 { padding-right: 44px; text-align: left; }   /* clears the skip button */
  .panel-close { position: absolute; top: 14px; right: 14px; }
  .lesson { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .lesson-visual { position: relative; width: 100%; max-width: 340px; }
  .lesson canvas { display: block; width: 100%; height: auto; border: 1px solid var(--hair); border-radius: 14px; background: var(--soft); }
  .lesson > span { font-size: 16px; font-weight: 650; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere; }
  html:lang(ja) .lesson > span, html:lang(zh-Hans) .lesson > span { word-break: normal; }
  .lesson-motion { position: absolute; right: 8px; top: 8px; width: 44px; height: 44px; border: 1px solid var(--hair); border-radius: 12px; background: #fff; color: var(--ink); font-size: 14px; }
  .lesson-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; padding-bottom: 4px; }
  .lesson-steps { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 44px; gap: 12px; }
  .lesson-steps > .btn { position: absolute; left: 0; }
  .lesson-foot .lesson-forward { flex: 1 1 100%; width: auto; min-width: 0; height: 46px; padding: 0 16px; border-radius: 12px; gap: 8px; font-size: 17px; box-shadow: 0 2px 0 var(--hot-deep), var(--press); }
  .lesson-foot .lesson-forward svg { width: 18px; height: 18px; }
  .share-status { min-height: 1.4em; margin: 12px 0 0; color: var(--ui-muted); font-size: 13px; }
  .share-status:empty { min-height: 0; margin: 0; }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dots i { width: 10px; height: 10px; border-radius: 5px; background: var(--edge); transition: width var(--ui-med) var(--ui-ease), background-color var(--ui-med); }
  .dots i.on { width: 26px; background: var(--hot); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  @media (max-width: 1099px) {   /* side clusters keep their width; the meter takes what is left */
    #hud { grid-template-columns: auto minmax(0, 1fr) auto; }
    #coverage { justify-self: center; }
  }
  @media (max-width: 719px) {
    #hud { inset-inline: 8px; grid-template-columns: auto minmax(0, 1fr); gap: 10px 8px; }
    #coverage { grid-row: 2; grid-column: 1 / -1; width: 100%; }
    #toast { top: 136px; }
    #controls { gap: 8px; }
    #controls .btn, #status { height: 48px; } #controls .btn { width: 48px; }
    #status { gap: 10px; padding: 0 12px 0 6px; }
    .num { min-width: 32px; height: 32px; border-radius: 10px; font-size: 16px; }
    .stage-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .sheet-head { padding-left: 18px; } .sheet-body { padding-inline: 18px; }
  }
  @media (max-width: 479px) {
    #status { gap: 8px; }
    #lives svg { width: 22px; height: 22px; } #pace svg { width: 15px; height: 15px; }
    #shots { font-size: 14px; } #shots b { font-size: 18px; }
    #overlay { padding: 12px; }
    .panel { padding: 22px 16px; }
    .panel.tutorial h1 { font-size: 22px; }
    .lesson > span { font-size: 15px; }
    .result-stars svg { width: 56px; height: 56px; } .result-stars svg:nth-child(2) { width: 74px; height: 74px; }
  }
  @media (max-width: 359px) {
    #controls .btn { width: 44px; }
    #status { gap: 6px; padding: 0 9px 0 5px; }
    #pace { display: none; }   /* the shot count still shows the par */
    #lives svg { width: 20px; height: 20px; }
    .btn.go { width: 84px; }
    .action-row { gap: 8px; } .action-row .btn:not(.go) { width: 50px; height: 50px; }
  }
  @media (max-height: 500px) {
    #hud { top: 8px; grid-template-columns: auto minmax(0, 1fr) auto; }
    #coverage { grid-row: auto; grid-column: auto; width: 460px; height: 46px; }
    #cov-now { font-size: 24px; }
    #controls .btn, #status { height: 46px; } #controls .btn { width: 46px; }
    .num { min-width: 30px; height: 30px; }
    .panel { padding: 16px 18px; max-height: calc(100dvh - 26px); }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .btn.go { height: 60px; } .menu .btn { height: 46px; } .menu .btn.go { height: 54px; font-size: 20px; }
    .panel.tutorial { width: min(600px, 100%); }
    .tutorial .lesson { flex-direction: row; text-align: left; gap: 14px; }
    .tutorial .lesson-visual { flex: 0 0 170px; }
    .lesson-foot { flex-wrap: nowrap; gap: 16px; margin-top: 10px; }
    .lesson-steps { width: auto; gap: 10px; }
    .lesson-steps > .btn { position: static; }
    .lesson-foot .lesson-forward { flex: 1; height: 46px; }
    .result-stars svg { width: 48px; height: 48px; } .result-stars svg:nth-child(2) { width: 62px; height: 62px; margin-bottom: 4px; }
    .result-icon { margin-bottom: 10px; } .result-icon svg { width: 64px; height: 64px; }
    .stats { margin-bottom: 12px; }
    .settings { margin-top: 14px; } .setting { min-height: 46px; }
    .stage-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .sheet-head { padding-block: 8px 9px; }
    #toast { top: 64px; padding: 6px 14px; font-size: 13px; }
  }

  /* Tall screens: the board is turned to fill the phone, with controls and status on top and the goal meter docked below. */
  body.tall #hud { top: max(var(--tall-top, 12px), env(safe-area-inset-top)); grid-template-columns: auto minmax(0, 1fr); }
  body.tall #coverage { position: fixed; left: 8px; right: 8px; bottom: max(var(--tall-bottom, 12px), env(safe-area-inset-bottom)); justify-self: stretch; width: auto; max-width: 560px; height: 58px; margin-inline: auto;
    padding: 0 16px; pointer-events: none; }
  body.tall #cov-now { font-size: 30px; }
  body.tall #toast { top: calc(max(var(--tall-top, 12px), env(safe-area-inset-top)) + 62px); }

  /* Wide screens, desktop or landscape phone: the board takes the full height. Controls and status stack in a left rail; the goal meter stands in a right rail.
     The rails hug the board instead of the screen edges, and their contents grow with the rail. */

function validateCampaign(recipes){

      r.chapter<chapter||!Number.isFinite(r.difficulty)||r.difficulty<0||r.difficulty>1||r.difficulty<previous||
      !Number.isInteger(r.par)||r.par<1||!Number.isFinite(r.target)||r.target<1||r.target>100||
      !Number.isInteger(r.variant)||r.variant<0||!LAYOUTS[r.layout]||!Number.isInteger(r.wallCount)||r.wallCount<0||r.wallCount>2||
      !Number.isFinite(r.wallPressure)||r.wallPressure<0||r.wallPressure>1||!Number.isFinite(r.speed)||r.speed<0||r.speed>144||
      !Number.isFinite(r.travel)||r.travel<64||r.travel>288||!Array.isArray(r.enemies)||!r.enemies.length||!Array.isArray(r.tools)||
      !Array.isArray(r.core)||!Array.isArray(r.review)||!['intro','application','challenge','boss'].includes(r.phase)||
      (r.shape!=null&&!Object.hasOwn(SHAPES,r.shape))||(r.zones!=null&&!Array.isArray(r.zones))||(r.phase==='boss')!==!!r.boss||
      (r.boss&&(!Number.isInteger(r.boss.hp)||r.boss.hp<2||r.boss.hp>6))||(r.lives!=null&&![1,2,3].includes(r.lives)))throw Error('Invalid campaign recipe: '+r.id);
    if(r.chapter!==chapter){checkRecurrence();chapter=r.chapter;prior=[...seen];used=new Set();}
    ids.add(r.id);previous=r.difficulty;
    if(r.enemies.some(k=>MECHANICS[k]?.type!=='enemy')||r.tools.some(k=>MECHANICS[k]?.type!=='tool')||(r.zones||[]).some(k=>MECHANICS[k]?.type!=='terrain'))throw Error('Unknown mechanic: '+r.id);

    if(r.tools.some(k=>!['primary','support'].includes(MECHANICS[k].role)))throw Error('Invalid tool role: '+r.id);

    const bx=26+phase(.06,.2)*70+ease(phase(.2,.62))*40;
    line([[26,112],[bx,112]],th.wet,8);ball(bx,112);enemy('basic',176,30+phase(.1,.9)*100);
  } else if(type==='haven') {
    // The trail runs through the fence untouched while the enemy bumps against it.
    drawZone(c,{kind:'haven',x0:72,y0:62,x1:176,y1:134},ts/1000);
    const s=phase(.08,.5),bx=Math.min(224,26+s*198);
    line([[26,98],[bx,98]],s>=1?th.ink:th.wet,8);ball(bx,98);
    enemy('basic',124,22+phase(.2,.5)*24-phase(.5,.8)*14);
  } else if(type==='spikes') {
    // Spikes hurt whatever touches them: the ball loses a heart, an enemy is finished.
    c.fillStyle=th.wall;c.fillRect(200,8,32,144);drawSpikes(c,{outline:[[8,8],[200,8],[200,152],[8,152]],blockers:[]},{a:[200,20],b:[200,140]},th.wall);
    const bx=30+phase(.08,.4)*156,hit=u>=.4,dash=phase(.5,.72);
    if(!hit)line([[30,52],[bx,52]],th.wet,8);
    ball(bx,52);
    if(hit){line([[177,43],[195,61]],th.tear,3);line([[195,43],[177,61]],th.tear,3);}
    c.font='18px '+uiFont;c.textAlign='center';c.textBaseline='middle';for(let i=0;i<3;i++){c.fillStyle=hit&&i===2?'#d5dbe4':th.tear;c.fillText('♥',32+i*20,84);}
    if(u<.72)enemy('charger',60+dash*116,118,{intent:{angle:0},visualScaleX:1+.14*Math.sin(dash*Math.PI),visualScaleY:1-.1*Math.sin(dash*Math.PI)});
    else effect('pop',176,118,phase(.72,.95),{actor:{kind:'charger',intent:{angle:0}}});
  } else if(BASE_R[type]) {
    const color=KIND_COLOR[type],acted=u>.45;
    ball(35,115);
    if(type==='charger') {
      line([[174,80],[40,80]],color,1.5,[4,5]);
      enemy(type,174-phase(.42,.66)*124,80,{visualScaleX:1+.14*Math.sin(phase(.42,.66)*Math.PI),visualScaleY:1-.1*Math.sin(phase(.42,.66)*Math.PI)});
      if(!acted)count(174,45,3-Math.floor(phase(.03,.42)*2),color);
    } else if(type==='shooter') {
      line([[174,80],[35,80]],color,1.5,[4,5]);enemy(type,174,80);
      if(acted){effect('fire',174,80,phase(.45,.7),{angle:Math.PI});c.fillStyle=color;circle(c,160-phase(.45,.75)*120,80,4);c.fill();}
    } else if(type==='jumper') {
      c.fillStyle=th.ink;c.fillRect(103,8,25,144);
      c.strokeStyle=color;c.setLineDash([3,5]);c.beginPath();c.moveTo(178,106);c.quadraticCurveTo(115,15,55,106);c.stroke();c.setLineDash([]);circle(c,55,106,15);c.stroke();
      const landed=u>=.45;enemy(type,landed?55:178,106);
      if(landed){c.globalAlpha=1-phase(.45,.7);c.strokeStyle=color;circle(c,178,106,15);c.stroke();c.globalAlpha=1;}
    } else if(type==='nest') {
      const turns=Math.min(3,Math.floor(u*4));enemy(type,151,84,{count:turns===3?3:3-turns});
      if(turns===3){enemy('basic',201,104);effect('spawn',201,104,phase(.75,1),{from:{x:151,y:84}});}
      arrow(35,126,57,126,th.ball);count(35,100,Math.min(3,turns+1));
    } else if(type==='eraser') {
      const turns=Math.min(3,Math.floor(u*4));c.fillStyle=th.ink;c.fillRect(20,40,100,100);
      enemy(type,180,80);line([[165,80],[78,91]],color,1,[3,5]);
      if(turns<3){c.strokeStyle=color;c.setLineDash([4,4]);circle(c,78,91,30);c.stroke();c.setLineDash([]);count(78,91,3-turns,color);}
      else {c.fillStyle=th.paper;circle(c,78,91,30);c.fill();effect('erase',78,91,phase(.75,1),{r:30});}
      count(185,128,Math.min(3,turns+1));
    } else enemy(type,155-phase(.05,.8)*65,80);
  }
  c.restore();
}

// ─── Boot ───────────────────────────────────────────────────────────────────
STAGES.forEach(validateStage);
fit(); localizeChrome(); syncToggles(); loadStage(STAGES[campaignProgress(records).unlockedThrough]);
sessionStarted = false; showHome();
if(window.top!==window){
  window.addEventListener('message',event=>{
    if(event.source!==window.top||event.data?.type!=='playroom:language'||event.data.gameId!=='ink-fill'||typeof event.data.language!=='string')return;
    let origin;try{origin=new URL(event.origin);}catch(_){return;}
    if(event.origin!=='https://playroom.mmonoo.com'&&!(origin.protocol==='http:'&&['127.0.0.1','localhost'].includes(origin.hostname)))return;
    const requested=event.data.language.toLowerCase();
    const code=requested==='zh-cn'?'zh-Hans':Object.keys(LANGUAGE_NAMES).find(code=>code.toLowerCase()===requested);
    setLanguage(code||'en',false);
  });
  window.top.postMessage({type:'playroom:language-ready',gameId:'ink-fill'},'*');
}
requestAnimationFrame(frame);
if (new URLSearchParams(location.search).get('test') === '1') {
  // Test-only hook: scenarios enter through the same validated loader, never private state edits.
  window.inkfill = {
    stages: STAGES.map(s => s.id),
    campaign: structuredClone(CAMPAIGN),
    generate(recipe) { const st=generateStage(recipe); validateStage(st); return structuredClone(st); },
    validateCampaign(recipes) { validateCampaign(recipes); return true; },
    select: selectStage,
    state() {return {...snapshot(world),panel:panelKind,theme:themeId,themeMode,guides:guidesOn,progress:campaignProgress(records)};},
    load(id) {
      const st = typeof id === 'string' ? STAGES.find(s => s.id === id) : { name: '검증', target: 99, par: 3, seed: 1, outline: RECT, blockers: [], ball: { x: 480, y: 632 }, enemies: [], orbs: [], ...id };
      if (!st) throw Error('Unknown stage'); loadStage(st); return true;
    },
    start() { if (panelKind === 'intro') closePanel(); return panelKind; },
    shoot: beginShot,
    settle() { let n = 0; while (world.moving && n++ < 3000 && !panelKind && !document.hidden) step(world); consumeEvents(); if (resultAt) showResult(); return !world.moving; },
    guide(angle,power) { return simulateGuide(angle,power,true); },
    trace(angle, power, frames) { if (!beginShot(angle, power)) return null; const out = [[world.ball.x, world.ball.y]]; for (let k = 0; k < frames && world.moving; k++) { step(world); out.push([world.ball.x, world.ball.y]); } consumeEvents(); return out; },
    traceWorld(angle,power,frames=360) { if(!beginShot(angle,power))return null;const timeline=[sampleWorld(world)];for(let k=0;k<frames&&world.moving;k++){step(world);timeline.push(sampleWorld(world));}const final=snapshot(world);consumeEvents();return {timeline,final}; },
    advance(frames=1) {for(let k=0;k<frames&&world.moving&&!panelKind&&!document.hidden;k++)step(world);consumeEvents();return snapshot(world);},
    setTheme,
    art() { return structuredClone({ ...currentMapArt, composition: PLAIN_VISUALS || themeId === 'minhwa' ? null : mapArtScene(world.stage) }); },
    // Solver used only by the offline route search; it runs the same step() on a cloned world.
    probe(shots) { const g = cloneWorld(world); g.quiet = true; for (const [a, p] of shots) { shoot(g, a, p); let n = 0; while (g.moving && n++ < 3000) step(g); if (g.result) break; } return { cov: g.inkCount / g.playable * 100, lives: g.lives, result: g.result, wet: g.wetCount,events:structuredClone(g.shotEvents),shots:g.shots };  },
  };
}
